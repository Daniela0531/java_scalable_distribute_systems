version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "8081:8081"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
